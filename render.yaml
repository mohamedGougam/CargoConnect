# Render Blueprint — always-on CargoConnect (live AIS prototype)
# Docs: docs/RENDER_DEPLOY.md
#
# Use plan: starter (or higher) for reliable AIS WebSocket.
# Free plan sleeps when idle and will drop the AISStream connection.

services:
  - type: web
    name: cargo-connect
    runtime: node
    plan: starter
    region: frankfurt
    branch: master
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NEXT_PUBLIC_MARITIME_DATA_MODE
        value: composite
      - key: MARITIME_DATA_MODE
        value: composite
      - key: AISSTREAM_ENABLED
        value: "true"
      - key: AISSTREAM_API_KEY
        sync: false
      - key: NEXT_PUBLIC_MAP_STYLE_URL
        value: dark
      - key: NEXT_PUBLIC_MARITIME_POLL_INTERVAL_MS
        value: "10000"
      - key: MARITIME_DIAGNOSTICS_ENABLED
        value: "true"
      # Demo persistence — PostgreSQL intentionally deferred
      - key: DEMO_MODE
        value: "true"
      - key: COMMERCIAL_STORE
        value: memory
      # Required for login/signup session cookies (generate a random ≥32 char secret)
      - key: AUTH_SECRET
        sync: false
      - key: APP_BASE_URL
        value: https://cargoconnect-avhp.onrender.com
      - key: TRUSTED_ORIGINS
        value: https://cargoconnect-avhp.onrender.com
      - key: RATE_LIMIT_PROVIDER
        value: memory
      # Demo malware bypass — PRE-PRODUCTION: switch to http scanner and remove ALLOW_NOOP
      - key: MALWARE_SCAN_PROVIDER
        value: noop
      - key: MALWARE_SCAN_ALLOW_NOOP
        value: "true"
      - key: AIS_PROVIDER_MODE
        value: development
      - key: EMAIL_DELIVERY_MODE
        value: log
      - key: SHIPMENT_OBSERVATION_INTERVAL_SECONDS
        value: "300"
      - key: SHIPMENT_OBSERVATION_JOB_SECRET
        sync: false
      - key: DEMO_RESET_SECRET
        sync: false
      # Optional Eastern Med bbox (default is already this region)
      # - key: AISSTREAM_BBOXES
      #   value: '[[[30.0,22.0],[41.5,37.0]]]'
  # External cron — does not run an in-process loop inside the web service.
  # Calls the protected observation endpoint every 5 minutes.
  - type: cron
    name: cargo-connect-shipment-observation
    runtime: node
    plan: starter
    region: frankfurt
    branch: master
    schedule: "*/5 * * * *"
    buildCommand: npm install
    startCommand: >-
      node -e "const u=process.env.CRON_TARGET_URL;const s=process.env.SHIPMENT_OBSERVATION_JOB_SECRET;if(!u||!s){console.error('missing CRON_TARGET_URL or secret');process.exit(1)}fetch(u,{method:'POST',headers:{Authorization:'Bearer '+s}}).then(async r=>{const t=await r.text();console.log(r.status,t.slice(0,500));process.exit(r.ok?0:1)}).catch(e=>{console.error(e.message);process.exit(1)})"
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CRON_TARGET_URL
        sync: false
      - key: SHIPMENT_OBSERVATION_JOB_SECRET
        sync: false
